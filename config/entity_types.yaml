# Rules for the rule-based `entity_type` assigned in Phase 2 (see aicidentia.data.entities).
# The AIID data has no entity-type field, so these are HEURISTICS, applied in the order below.
# They are meant for network/dashboard grouping, not as ground truth. Correct any entity with
# `overrides` (slug -> type) and re-run scripts/run_phase2_prepare.py.
#
# Types: organisation, generic_actor_group, technology_system, population_group,
#        abstract_value, individual_candidate, unknown

overrides:
  none: unknown  # an entity literally named "None"

# 1. Entities appearing (almost) only as a harmed party whose name is an abstract value or interest.
abstract_value_terms:
  - integrity
  - privacy
  - epistemic
  - democracy
  - democratic
  - trust
  - autonomy
  - dignity
  - reputation
  - fairness
  - equality
  - freedom
  - justice
  - safety
  - security
  - wellbeing
  - well-being
  - cultural heritage
  - public discourse
  - information ecosystem
  - intellectual property
  - copyright
  - property
  - environment
  - public trust
  - human rights

# 2. Entities that are mostly implicated systems, or whose name denotes a technology.
