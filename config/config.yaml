# AICIDENTIA project configuration. All paths are relative to the project root.
project_name: AICIDENTIA
dashboard_name: AICIDENTIA Intelligence
tagline: "Discovering Patterns. Understanding AI Harm. Learning from Failure."
full_title: "Learning from Failure: A Data-Driven Analysis of Reported Real-World AI Incidents"

# Frozen data snapshot: set to the YYYYMMDD in AIID_Excel_Export-YYYYMMDD.xlsx once downloaded.
snapshot_date: 20261026

random_seed: 42

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  external: data/external
  manual: data/manual
  models: models
  figures: reports/figures
  tables: reports/tables
  manifest: docs/data_manifest.md

files:
  # Globs inside paths.raw; the date part is whatever you downloaded.
  excel_export_glob: "AIID_Excel_Export-20261026.xlsx"
  snapshot_glob: "backup-20261026.tar.bz2"
  excel_sheets: [Incidents, Reports, Entities, Data Dictionary, Coverage Map]
  hand_labels: hand_labels_150.csv # placed in paths.manual

models:
  sentence_embedding_small: sentence-transformers/all-MiniLM-L6-v2
  sentence_embedding_large: sentence-transformers/all-mpnet-base-v2
  transformer_classifier: distilbert-base-uncased

# Inclusive year range for trend analysis (RQ1). Adjust after the data audit.
year_range:
  start: 1983
  end: 2026

# Privacy handling for named individuals (see data/manual/entity_review.csv).
privacy:
  # true = also drop every person-like entity you have NOT explicitly cleared (is_private_individual = no)
  # from the network and dashboard. false = drop only those you confirmed as private individuals.
  exclude_unreviewed_individual_candidates: false

# Phase 3: risk-theme models (LDA vs NMF vs BERTopic). All models share one tokenised corpus.
topics:
  n_seeds: 5                  # seeds base..base+4; stability and mean metrics use all of them
  k_grid: [8, 10, 12, 15, 18, 20, 25]   # topic counts for LDA and NMF
  eligible_topics: [8, 25]    # topic-count range considered interpretable when choosing a winner
  top_n: 10                   # words per topic used for coherence, diversity and labelling
  min_df: 3                   # keep tokens found in >= 3 incidents ...
  max_df: 0.5                 # ... and in at most 50% of incidents
  min_tokens: 3               # incidents with fewer tokens after filtering are flagged
  domain_stopwords:           # hedging and boilerplate words that carry no theme
    [ai, artificial, intelligence, system, systems, algorithm, algorithms, incident, incidents,
     allegedly, alleged, reportedly, reported, purportedly, purported, reportedly, according, said,
     also, one, two, new, use, used, using, based, may, could, would, around, including, include,
     following, found, via, per, amid, led, reportedly, claimed, claim, claims, appeared, appear]
  lda: {passes: 15, iterations: 200}
  nmf: {max_iter: 600}
  bertopic:
    embedding_models: [sentence_embedding_small, sentence_embedding_large]   # keys of `models`
    min_cluster_size: [15, 20, 25, 30, 40, 50]   # chosen from topic counts only: covers 8-40 topics
    min_samples: 3
    umap: {n_neighbors: 15, n_components: 5, min_dist: 0.0, metric: cosine}
    outlier_strategy: embeddings

# Phase 4: trend tests and forecasting (RQ1b). The test window itself comes from the Phase 1 audit
# (registry key audit.year_range_recommendation: complete years only, every year >= 20 incidents).
trends:
  alpha: 0.05                 # Benjamini-Hochberg false-discovery rate
  recent_years: 2             # "recent" = mean share of the last two complete years
  sensitivity_start: 2018     # second window: 2018 .. last complete year
  forecast:
    initial_quarters: 24      # first training window: 2015Q1-2020Q4
    horizon: 4                # forecast 1-4 quarters ahead
    min_mean_count: 1.0       # series with a mean below this per quarter are not scored (MASE unstable)
    arima_orders: [[0, 1, 1], [1, 1, 0], [1, 1, 1], [2, 1, 1], [0, 1, 2], [1, 0, 0], [1, 0, 1], [2, 0, 0]]

# Phase 5: incident network (RQ2)
network:
  min_incidents: 2             # an entity enters the co-occurrence network if it appears in >= 2 incidents
  n_seeds: 10                  # seeds base..base+9 for community detection stability (ARI)
  min_stability_ari: 0.5       # rule: best modularity among methods with mean ARI >= this
  hub_share_cap: 0.05          # robustness check: drop entities appearing in more than 5% of incidents
  include_individual_candidates: false   # person-like entities stay out of the network
  top_n_table: 10
  export: {top_n: 150, max_edges: 900}   # dashboard JSON caps

# Phase 6: risk-domain classification and the label audit (RQ3)
classification:
  n_boot: 1000                 # bootstrap resamples for confidence intervals and paired tests
  report_words: 256            # ablation: words of the longest linked report appended to the text
  audit: {total: 150, floor: 10}   # blind audit sample: 150 incidents, at least 10 per MIT domain
