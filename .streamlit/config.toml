# AICIDENTIA Intelligence theme: one colour-blind-safe palette (Okabe-Ito), one accent colour (blue #0072B2).
[theme]
base = "light"
primaryColor = "#0072B2"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F5F9"
textColor = "#1B2430"
font = "sans serif"
baseRadius = "0.5rem"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true
