<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>AICIDENTIA methods overview: data, preparation, RQ1-RQ4, dashboard</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6675"/>
    </marker>
    <style>
      .box { fill: #FFFFFF; stroke-width: 2.5; rx: 14; }
      .title { font-size: 26px; font-weight: 700; fill: #1B2430; }
      .head { font-size: 21px; font-weight: 700; fill: #1B2430; }
      .text { font-size: 16.5px; fill: #3D4756; }
      .small { font-size: 14.5px; fill: #5B6675; }
      .link { stroke: #5B6675; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="760" fill="#FFFFFF"/>
  <text x="40" y="52" class="title">AICIDENTIA: from reported AI incidents to an evidence dashboard (CRISP-DM)</text>
  <text x="40" y="82" class="small">AIID snapshot 2026-10-26 · fixed seed 42 · every number in reports/results.json · every rule in docs/decisions.md</text>

  <!-- 1 Data -->
  <rect x="40" y="130" width="250" height="300" class="box" stroke="#7F7F7F"/>
  <text x="62" y="168" class="head">1 Data</text>
  <text x="62" y="202" class="text">AI Incident Database</text>
  <text x="62" y="226" class="text">Excel export + full dump</text>
  <text x="62" y="262" class="text">1,775 incidents</text>
  <text x="62" y="286" class="text">8,023 reports</text>
  <text x="62" y="322" class="text">Labels: MIT (automatic),</text>
  <text x="62" y="346" class="text">CSETv1 and GMF (human)</text>
  <text x="62" y="382" class="text">Editor-linked similar</text>
  <text x="62" y="406" class="text">incidents</text>

  <!-- 2 Preparation -->
  <rect x="340" y="130" width="270" height="300" class="box" stroke="#7F7F7F"/>
  <text x="362" y="168" class="head">2 Preparation</text>
  <text x="362" y="202" class="text">Audit and validation</text>
  <text x="362" y="226" class="text">(22 checks pass)</text>
  <text x="362" y="262" class="text">Duplicates: AIID list +</text>
  <text x="362" y="286" class="text">strict rule D2</text>
  <text x="362" y="322" class="text">Entities: aliases, types;</text>
  <text x="362" y="346" class="text">all named persons out (D3)</text>
  <text x="362" y="382" class="text">Shared tokenisation,</text>
  <text x="362" y="406" class="text">cached embeddings</text>

  <!-- RQ boxes -->
  <rect x="680" y="110" width="430" height="128" class="box" stroke="#0072B2"/>
  <text x="702" y="146" class="head" fill="#0072B2">RQ1 Risk themes and trends</text>
  <text x="702" y="176" class="text">LDA vs NMF vs BERTopic → NMF k=12 (fixed rule)</text>
  <text x="702" y="200" class="text">Mann-Kendall + Sen's slope + Benjamini-Hochberg</text>
  <text x="702" y="224" class="text">Before/after ChatGPT: chi-square, Cramer's V</text>

  <rect x="680" y="254" width="430" height="104" class="box" stroke="#009E73"/>
  <text x="702" y="290" class="head">RQ2 Incident network</text>
  <text x="702" y="320" class="text">Entity co-occurrence, centrality (PageRank)</text>
  <text x="702" y="344" class="text">Louvain vs Leiden vs label propagation → Leiden</text>

  <rect x="680" y="374" width="430" height="150" class="box" stroke="#E69F00"/>
  <text x="702" y="410" class="head">RQ3 Classification and label reliability</text>
  <text x="702" y="440" class="text">TF-IDF / embeddings / DistilBERT, nested CV,</text>
  <text x="702" y="464" class="text">time split, temperature scaling → mpnet + LR</text>
  <text x="702" y="488" class="text">Reliability: CSETv1/GMF kappa, RQ4 editor pairs,</text>
  <text x="702" y="512" class="text">confident learning (cleanlab)</text>

  <rect x="680" y="540" width="430" height="128" class="box" stroke="#CC79A7"/>
  <text x="702" y="576" class="head">RQ4 Similar incidents and precedents</text>
  <text x="702" y="606" class="text">TF-IDF vs BM25 vs embeddings vs hybrid</text>
  <text x="702" y="630" class="text">MRR against editor links → BM25 deployed</text>
  <text x="702" y="654" class="text">Repeated failures since 2024, earlier-only search</text>

  <!-- Synthesis -->
  <rect x="1160" y="254" width="180" height="270" class="box" stroke="#D55E00"/>
  <text x="1178" y="292" class="head">Synthesis</text>
  <text x="1178" y="326" class="text">Risk priority</text>
  <text x="1178" y="350" class="text">matrix</text>
  <text x="1178" y="386" class="text">Themes x</text>
  <text x="1178" y="410" class="text">communities x</text>
  <text x="1178" y="434" class="text">domains</text>
  <text x="1178" y="470" class="text">5 key findings</text>

  <!-- Dashboard -->
  <rect x="1380" y="110" width="190" height="558" class="box" stroke="#0072B2" fill="#F2F5F9"/>
  <text x="1398" y="148" class="head" fill="#0072B2">Dashboard</text>
  <text x="1398" y="174" class="small">AICIDENTIA Intelligence</text>
  <text x="1398" y="214" class="text">Key Findings</text>
  <text x="1398" y="248" class="text">Themes and Trends</text>
  <text x="1398" y="282" class="text">Risk Priority Matrix</text>
  <text x="1398" y="316" class="text">Risk Network</text>
  <text x="1398" y="350" class="text">Precedent Finder</text>
  <text x="1398" y="384" class="text">Label Reliability</text>
  <text x="1398" y="418" class="text">Method and</text>
  <text x="1398" y="440" class="text">Limitations</text>
  <text x="1398" y="490" class="small">Offline, precomputed,</text>
  <text x="1398" y="512" class="small">under 3 s per page;</text>
  <text x="1398" y="534" class="small">global filters,</text>
  <text x="1398" y="556" class="small">CSV downloads</text>

  <!-- arrows -->
  <path d="M290 280 L336 280" class="link"/>
  <path d="M610 280 C645 280 645 174 676 174" class="link"/>
  <path d="M610 280 L676 306" class="link"/>
  <path d="M610 280 C645 280 645 449 676 449" class="link"/>
  <path d="M610 280 C645 280 645 604 676 604" class="link"/>
  <path d="M1110 174 C1135 174 1135 330 1156 330" class="link"/>
  <path d="M1110 306 L1156 360" class="link"/>
  <path d="M1110 449 L1156 420" class="link"/>
  <path d="M1110 604 C1135 604 1135 470 1156 470" class="link"/>
  <path d="M1340 389 L1376 389" class="link"/>
  <path d="M1110 640 C1250 640 1250 620 1376 620" class="link"/>

  <text x="40" y="720" class="small">Reproducible: scripts/run_all.py regenerates every table, figure and document from data/raw; a rerun leaves git unchanged. Organisations are alleged; MIT labels are machine-generated.</text>
</svg>
